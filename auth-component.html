<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auth Component — Je Suis Beatz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-component.css">
</head>
<body>

<div class="auth-root">
  <div class="auth-container" id="authContainer">

    <div class="panel left-panel" id="leftPanel">
      <div class="content">
        <div class="lang-switch">
          <button id="langToggle" aria-label="Toggle language">FR | EN</button>
        </div>
        <h2 class="welcome" data-i18n="welcome">Bienvenue !</h2>
        <p class="desc" data-i18n="desc">Pour rester connecté avec nous, veuillez vous connecter avec vos informations personnelles</p>
        <button class="btn-ghost" id="switchToSignUp" data-action="toggle">Créer un compte</button>
        <div class="auth-trust"><i class="fas fa-shield-halved"></i> <span data-i18n="auth_trust">Accès sécurisé à votre espace studio</span></div>
      </div>
    </div>

    <div class="panel right-panel" id="rightPanel">
      <div class="form-wrap">
        <div class="auth-kicker" data-i18n="auth_kicker">STUDIO ACCESS</div>
        <h3 class="form-title" data-i18n="signin_title">Se connecter</h3>
        <p class="auth-form-subtitle" data-i18n="auth_form_subtitle">Retrouvez vos achats, licences et projets.</p>
        <div class="socials">
          <button class="social-btn" data-provider="google" aria-label="Sign in with Google">G</button>
        </div>
        <div class="sep"><span data-i18n="or_use">ou utilisez votre email pour vous inscrire</span></div>
        <form id="authForm" autocomplete="on">
          <div class="field name-field">
            <label for="name" data-i18n="name">Nom</label>
            <input id="name" name="name" placeholder="" />
          </div>
          <div class="field email-field">
            <label for="email" data-i18n="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="" required />
          </div>
          <div class="field pass-field">
            <label for="password" data-i18n="password">Mot de passe</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" required autocomplete="current-password" />
              <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Afficher le mot de passe"></button>
            </div>
          </div>
          <div class="auth-actions">
            <button type="button" class="text-btn forgot-password" data-i18n="forgot_password">Mot de passe oublié ?</button>
          </div>
          <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="mainAction" data-i18n="signin_btn">Se connecter</button>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="auth-component.js"></script>
</body>
</html>
