name: Deploy Proxy to Cloud Run

on:
  workflow_dispatch:

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet
      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROXY_SERVICE_NAME }}:latest -f Dockerfile.proxy .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROXY_SERVICE_NAME }}:latest
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.PROXY_SERVICE_NAME }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROXY_SERVICE_NAME }}:latest \
            --region ${{ secrets.GCP_REGION }} --platform managed --allow-unauthenticated
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
